<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patches</title>
<link rel="stylesheet" href="assets/shared.css">
<style>
  .pwrap { position: relative; width: 100%; aspect-ratio: 1; touch-action: none; border: 2px solid #111; border-radius: 10px; overflow: hidden; background: #fff; }
  .pgrid { position: absolute; inset: 0; display: grid; }
  .pcell { border: 1px solid #e3e1dd; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .rect { position: absolute; border-radius: 8px; border: 2.5px solid rgba(0,0,0,.55); margin: 2px; box-sizing: border-box; }
  .rect.prev { border-style: dashed; background: rgba(10,102,194,.18) !important; }
  .rect.badp { background: rgba(204,16,22,.2) !important; border-color: var(--bad); }
  .clue { position: absolute; display: grid; place-items: center; }
  .clue .badge { display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 8px; background: rgba(255,255,255,.92); border: 1.5px solid #333; font-weight: 800; font-size: clamp(13px, 4vw, 18px); line-height: 1; }
  .shapeic { display: inline-block; border: 2px solid #333; border-radius: 2px; }
  .shapeic.sq { width: 11px; height: 11px; }
  .shapeic.wide { width: 15px; height: 9px; }
  .shapeic.tall { width: 9px; height: 15px; }
  /* ---- solved: the pieces merge into a heart ---- */
  .pwrap.solved { border-color: transparent; background: #fff; }
  .pwrap.solved .pgrid { opacity: 0; transition: opacity .6s; }
  .pwrap.solved .clue { opacity: 0; transition: opacity .6s; }
  .pwrap.solved .rect { margin: 0; border-color: transparent; border-radius: 0; transition: background .9s ease, margin .6s, border-radius .6s; }
  .pwrap.solved .rect.heart { animation: beat 1.1s ease-in-out 1.0s 2; }
  @keyframes beat { 0%,100% { filter: none } 50% { filter: brightness(1.12) saturate(1.15) } }
  .legend { display: flex; gap: 14px; justify-content: center; margin: 12px 0 0; font-size: 12.5px; color: var(--muted); align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
</style>
</head>
<body>
<div class="app">
  <div id="topbar"></div>
  <main class="main">
    <p class="instr">Drag to draw rectangles covering the grid. Each holds one clue showing its size and shape. Tap a rectangle to remove it.</p>
    <div class="boardbox">
      <div class="pwrap noselect" id="wrap">
        <div class="pgrid" id="grid"></div>
        <div class="layer" id="rects"></div>
        <div class="layer" id="clues"></div>
      </div>
    </div>
    <div class="legend"><span><i class="shapeic sq"></i> square</span><span><i class="shapeic wide"></i> wide</span><span><i class="shapeic tall"></i> tall</span></div>
    <div class="toolbar"><button class="btn ghost" id="undo">Undo</button><button class="btn ghost" id="clear">Clear</button></div>
  </main>
</div>
<script src="assets/theme.js"></script>
<script src="assets/shared.js"></script>
<script>
(function () {
  var P = GP.T.puzzles.patches, N = P.size;
  var g = GP.init('patches');
  var PC = GP.T.puzzles.patchesColors, COLORS = PC.play, HEART = P.heart, solved = false;
  var clues = {}; P.clues.forEach(function (c) { clues[c[0] + ',' + c[1]] = { r: c[0], c: c[1], area: c[2], shape: c[3] }; });
  var rects = [], hist = [], anchor = null, preview = null, moved = false;
  function inHeart(R) { for (var r = R.top; r < R.top + R.h; r++) for (var c = R.left; c < R.left + R.w; c++) if (HEART[r][c] !== 'X') return false; return true; }

  var wrap = document.getElementById('wrap'), grid = document.getElementById('grid'), rectLayer = document.getElementById('rects'), clueLayer = document.getElementById('clues');
  grid.style.gridTemplateColumns = 'repeat(' + N + ', 1fr)';
  for (var i = 0; i < N * N; i++) { var d = document.createElement('div'); d.className = 'pcell'; grid.appendChild(d); }
  var pct = 100 / N;

  function place(el, r, c, h, w) {
    el.style.left = (c * pct) + '%'; el.style.top = (r * pct) + '%'; el.style.width = (w * pct) + '%'; el.style.height = (h * pct) + '%';
  }
  function shapeOf(h, w) { return h === w ? 'sq' : (w > h ? 'wide' : 'tall'); }

  // Draw clues once
  Object.keys(clues).forEach(function (k) {
    var q = clues[k], el = document.createElement('div'); el.className = 'clue'; place(el, q.r, q.c, 1, 1);
    el.innerHTML = '<span class="badge">' + q.area + '<i class="shapeic ' + q.shape + '"></i></span>';
    clueLayer.appendChild(el);
  });

  function validate(r0, c0, r1, c1) {
    var top = Math.min(r0, r1), left = Math.min(c0, c1), h = Math.abs(r1 - r0) + 1, w = Math.abs(c1 - c0) + 1;
    var found = [];
    for (var r = top; r < top + h; r++) for (var c = left; c < left + w; c++) if (clues[r + ',' + c]) found.push(clues[r + ',' + c]);
    var ok = found.length === 1 && found[0].area === h * w && found[0].shape === shapeOf(h, w);
    return { top: top, left: left, h: h, w: w, ok: ok };
  }
  function overlap(a, b) { return !(a.top + a.h <= b.top || b.top + b.h <= a.top || a.left + a.w <= b.left || b.left + b.w <= a.left); }

  function render() {
    rectLayer.innerHTML = '';
    rects.forEach(function (R, i) {
      var el = document.createElement('div'); el.className = 'rect'; place(el, R.top, R.left, R.h, R.w);
      if (solved) { var hh = inHeart(R); el.style.background = hh ? PC.heart : PC.off; if (hh) el.classList.add('heart'); }
      else el.style.background = COLORS[R.color % COLORS.length];
      rectLayer.appendChild(el);
    });
    if (preview) {
      var pe = document.createElement('div'); pe.className = 'rect prev' + (preview.ok ? '' : ' badp'); place(pe, preview.top, preview.left, preview.h, preview.w); rectLayer.appendChild(pe);
    }
    var covered = 0; rects.forEach(function (R) { covered += R.h * R.w; });
    if (covered === N * N && !solved) {
      solved = true; wrap.classList.add('solved');
      setTimeout(function () {                          // fade the pieces into heart colours
        var els = rectLayer.children;
        rects.forEach(function (R, i) { var hh = inHeart(R); els[i].style.background = hh ? PC.heart : PC.off; if (hh) els[i].classList.add('heart'); });
      }, 60);
      g.win(null, 2600);     // timer stops now; the sheet waits for the heart reveal
    }
  }

  function cellAt(e) {
    var b = wrap.getBoundingClientRect();
    var c = Math.floor((e.clientX - b.left) / b.width * N), r = Math.floor((e.clientY - b.top) / b.height * N);
    return [Math.max(0, Math.min(N - 1, r)), Math.max(0, Math.min(N - 1, c))];
  }
  function rectAt(r, c) { for (var i = 0; i < rects.length; i++) { var R = rects[i]; if (r >= R.top && r < R.top + R.h && c >= R.left && c < R.left + R.w) return i; } return -1; }

  wrap.addEventListener('pointerdown', function (e) {
    if (!g.started || g.done) return;
    anchor = cellAt(e); moved = false; preview = validate(anchor[0], anchor[1], anchor[0], anchor[1]); render(); e.preventDefault();
  });
  wrap.addEventListener('pointermove', function (e) {
    if (!anchor) return;
    var c = cellAt(e);
    if (c[0] !== anchor[0] || c[1] !== anchor[1]) moved = true;
    preview = validate(anchor[0], anchor[1], c[0], c[1]); render();
  });
  function finish(e, cancel) {
    if (!anchor) return;
    var a = anchor; anchor = null;
    var p = preview; preview = null;
    if (!cancel && p) {
      if (!moved) {                                    // a tap: remove the rectangle under the finger
        var i = rectAt(a[0], a[1]);
        if (i >= 0) { hist.push(JSON.stringify(rects)); rects.splice(i, 1); }
        else if (p.ok) { hist.push(JSON.stringify(rects)); rects.push({ top: p.top, left: p.left, h: p.h, w: p.w, color: rects.length }); }
      } else if (p.ok) {
        hist.push(JSON.stringify(rects));
        rects = rects.filter(function (R) { return !overlap(R, p); });
        rects.push({ top: p.top, left: p.left, h: p.h, w: p.w, color: Math.floor(Math.random() * COLORS.length) });
      } else { GP.shake(wrap); }
    }
    render();
  }
  wrap.addEventListener('pointerup', function (e) { finish(e, false); });
  wrap.addEventListener('pointercancel', function (e) { finish(e, true); });

  document.getElementById('undo').onclick = function () { if (g.done || !hist.length) return; rects = JSON.parse(hist.pop()); render(); };
  document.getElementById('clear').onclick = function () { if (g.done || !rects.length) return; hist.push(JSON.stringify(rects)); rects = []; render(); };
  render();
})();
</script>
</body>
</html>
