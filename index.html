<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Games</title>
<link rel="stylesheet" href="assets/shared.css">
</head>
<body>
<div class="app">
  <header class="hubhead">
    <div class="logo" id="logo"></div>
    <div class="bn"><span id="bname"></span><small>Games</small></div>
    <img class="me" id="me" alt="" hidden>
  </header>
  <main>
    <section class="hero">
      <h1 id="h1">Today's puzzles</h1>
      <p id="sub"></p>
    </section>
    <section class="progress">
      <div class="row"><span>Your progress</span><span id="count"></span></div>
      <div class="bar"><i id="fill" style="width:0"></i></div>
    </section>
    <section class="cards" id="cards"></section>
    <div class="resetwrap"><button class="btn ghost small" id="resetAll">Reset all progress</button></div>
    <div class="foot" id="foot"></div>
  </main>
</div>
<script src="assets/theme.js"></script>
<script src="assets/shared.js"></script>
<script>
(function () {
  var T = GP.T;
  document.title = T.brand.name + ' Games';
  document.getElementById('logo').textContent = T.brand.letter;
  document.getElementById('bname').textContent = T.brand.name;
  document.getElementById('foot').textContent = T.brand.footer;
  var me = document.getElementById('me'), ph = T.players.photos || {};
  if (ph.you) { me.src = ph.you; me.alt = T.players.you; me.hidden = false; me.onerror = function () { me.hidden = true; }; }
  var d = new Date();
  document.getElementById('sub').textContent = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) + ' · ' + T.brand.tagline;

  var done = 0, box = document.getElementById('cards');
  T.games.forEach(function (g) {
    var rec = GP.store.get('done:' + g.id);
    if (rec) done++;
    var a = document.createElement('a');
    a.className = 'gcard' + (rec ? ' done' : '');
    a.href = g.file;
    a.innerHTML = '<div class="ic">' + GP.icons[g.id] + '</div><div class="nm">' + g.name + '</div><div class="tg">' + g.tag +
      '</div><span class="st">' + (rec ? '✓ ' + GP.fmt(rec.time) : 'Play') + '</span>';
    box.appendChild(a);
  });
  document.getElementById('h1').textContent = "Today's puzzles, " + T.players.you;
  document.getElementById('count').textContent = done + ' of ' + T.games.length + ' solved';
  document.getElementById('fill').style.width = (done / T.games.length * 100) + '%';

  // ---- global reset ----
  var rb = document.getElementById('resetAll');
  rb.disabled = done === 0;
  rb.style.opacity = done === 0 ? '.45' : '1';
  rb.onclick = function () {
    var m = GP.el('div', 'overlay modal');
    m.innerHTML = '<div class="sheet"><h1 style="font-size:22px;margin-top:0">Reset all progress?</h1>' +
      '<p class="sub">This clears every solved puzzle and time, so all ' + T.games.length + ' games start fresh.</p>' +
      '<div class="stack"><button class="btn danger block" id="rsAllOk">Reset everything</button><button class="btn ghost block" id="rsAllNo">Cancel</button></div></div>';
    document.body.appendChild(m);
    document.getElementById('rsAllNo').onclick = function () { m.remove(); };
    document.getElementById('rsAllOk').onclick = function () { GP.store.clearAll(); location.reload(); };
  };
})();
</script>
</body>
</html>
